{
  "openapi": "3.1.0",
  "info": {
    "title": "RepairLens API",
    "version": "1.0.0",
    "description": "Contract iteration precedes backend. Same-origin cookie sessions, CSRF, role projections, immutable accepted quotes and serialized transactional changes. KZT minor units. Server timestamps are authoritative. No payments/chat/reviews."
  },
  "servers": [
    {
      "url": "http://localhost:3000",
      "description": "Local same-origin application"
    }
  ],
  "paths": {
    "/api/session": {
      "get": {
        "operationId": "session",
        "summary": "Get session, CSRF token and authorized workspace",
        "description": "Get session, CSRF token and authorized workspace",
        "security": [],
        "responses": {
          "200": {
            "description": "Authorized projected workspace snapshot",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Snapshot"
                }
              }
            }
          },
          "401": {
            "description": "Sign in required or invalid credentials",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Forbidden role, pending workshop, or missing/invalid CSRF",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Inaccessible or missing resource",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "State conflict, duplicate account or quote, or stale selection",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Request/photo exceeds size limit",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "description": "Invalid fields, quote amounts or photo signature",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": []
      }
    },
