  "components": {
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "repairlens_session",
        "description": "Opaque random HttpOnly SameSite=Strict cookie; 24h expiry. Secure in production HTTPS."
      }
    },
    "schemas": {
      "User": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "name": {
            "type": "string"
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "role": {
            "type": "string",
            "enum": [
              "customer",
              "workshop",
              "admin"
            ]
          },
          "approved": {
            "type": "boolean"
          },
          "contact": {
            "type": "string"
          }
        },
        "required": [
          "id",
          "name",
          "email",
          "role",
          "approved",
          "contact"
        ],
        "additionalProperties": false
      },
      "Terms": {
        "type": "object",
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "fixed",
              "estimated"
            ]
          },
          "fees": {
            "type": "object",
            "properties": {
              "labour": {
                "type": [
                  "integer",
                  "null"
                ],
                "minimum": 0,
                "maximum": 10000000000,
                "description": "KZT minor units (100 = 1 KZT); null means unknown, zero means no charge."
              },
              "parts": {
                "type": [
                  "integer",
                  "null"
                ],
                "minimum": 0,
                "maximum": 10000000000,
                "description": "KZT minor units (100 = 1 KZT); null means unknown, zero means no charge."
              },
              "diagnostics": {
                "type": [
                  "integer",
                  "null"
                ],
                "minimum": 0,
                "maximum": 10000000000,
                "description": "KZT minor units (100 = 1 KZT); null means unknown, zero means no charge."
              },
              "optional": {
                "type": [
                  "integer",
                  "null"
                ],
                "minimum": 0,
                "maximum": 10000000000,
                "description": "KZT minor units (100 = 1 KZT); null means unknown, zero means no charge."
              }
            },
            "required": [
              "labour",
              "parts",
              "diagnostics",
              "optional"
            ],
            "additionalProperties": false
          },
          "scope": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2000
          },
          "days": {
            "type": "integer",
            "minimum": 1,
            "maximum": 365
          },
          "warranty": {
            "type": "string",
            "minLength": 1,
            "maxLength": 300
          },
          "exclusions": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500
          }
        },
        "required": [
          "kind",
          "fees",
          "scope",
          "days",
          "warranty",
          "exclusions"
        ],
        "additionalProperties": false,
        "description": "Required fees are labour, parts, diagnostics. Fixed quotes prohibit null required fees. Known subtotal excludes optional; null is never zero. Accepted versions are immutable."
      },
      "Photo": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100,
            "description": "Server-generated opaque identifier on upload; client provisional IDs are never trusted."
          },
          "name": {
            "type": "string",
            "maxLength": 200
          },
          "url": {
            "type": "string",
            "description": "On upload: data:image/jpeg|png|webp;base64,..., maximum decoded 3 MiB. On response: protected /api/photos/{id} URL."
          }
        },
        "required": [
          "id",
          "name",
          "url"
        ],
        "additionalProperties": false
      },
      "Repair": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "ownerId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "category": {
            "type": "string",
            "enum": [
              "Smartphone",
              "Laptop",
              "Washing machine"
            ]
          },
          "brand": {
            "type": "string"
          },
          "model": {
            "type": "string"
          },
          "fault": {
            "type": "string"
          },
          "city": {
            "type": "string"
          },
          "contact": {
            "type": "string"
          },
          "photos": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Photo"
            },
            "maxItems": 3
          },
          "status": {
            "type": "string",
            "enum": [
              "open",
              "accepted",
              "in_repair",
              "ready",
              "completed",
              "cancelled"
            ]
          },
          "selectedId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "pending": {
            "$ref": "#/components/schemas/Terms"
          },
          "accepted": {
            "$ref": "#/components/schemas/Terms"
          },
          "history": {
            "type": "array",
            "items": {
              "type": "string",
              "description": "Example: 2026-10-20T08:30:00.000Z \u00b7 Workshop name \u00b7 Revision proposed: {serialized Terms}. Original accepted terms remain in an earlier entry."
            },
            "description": "Append-only activity strings. Each server event begins with an ISO 8601 UTC timestamp followed by actor and action. Offer selection and revision acceptance/proposal preserve complete serialized Terms snapshots in these strings. Prior entries are never edited by mutations; authorized projections may redact commercial payloads for competing workshops."
          }
        },
        "required": [
          "id",
          "ownerId",
          "category",
          "brand",
          "model",
          "fault",
          "city",
          "contact",
          "photos",
          "status",
          "history"
        ],
        "additionalProperties": false,
        "description": "Only owner and approved workshops receive requests. Competing workshops never receive selected/pending quote terms or commercial history payloads. Contact is visible immediately to approved workshops."
      },
      "Offer": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "requestId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "workshopId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "workshopName": {
            "type": "string"
          },
          "terms": {
            "$ref": "#/components/schemas/Terms"
          },
          "withdrawn": {
            "type": "boolean"
          }
        },
        "required": [
          "id",
          "requestId",
          "workshopId",
          "workshopName",
          "terms",
          "withdrawn"
        ],
        "additionalProperties": false
      },
      "Snapshot": {
        "type": "object",
        "properties": {
          "me": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/User"
              },
              {
                "type": "null"
              }
            ]
          },
          "users": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/User"
            }
          },
          "requests": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Repair"
            }
          },
          "offers": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Offer"
            }
          },
          "csrfToken": {
            "type": "string"
          }
        },
        "required": [
          "me",
          "users",
          "requests",
          "offers",
          "csrfToken"
        ],
        "additionalProperties": false,
        "description": "Admin users list contains workshop applications only. Customers see only own requests and their offers; workshops only their own offers; anonymous/pending accounts see no private resources. Session token never returned in JSON."
      },
      "Error": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "fields": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            }
          }
        },
        "required": [
          "code",
          "message"
        ],
        "additionalProperties": false
      }
    }
  }
}
