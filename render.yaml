# Free demonstration deployment. Do not upgrade plans or enter payment details.
# Render Blueprints deploy Dockerfile services and managed PostgreSQL separately;
# they do NOT execute compose.yaml directly. Compose remains the local/CI stack.
services:
  - type: web
    name: repairlens-mvp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: STORAGE
        value: postgres
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_SCHEMA
        value: public
      - key: RENDER_DEPLOY_HANDOFF
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: repairlens-postgres
          property: connectionString
      # Must match the exact assigned HTTPS URL, including any suffix.
      - key: APP_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: repairlens-postgres
    plan: free
    databaseName: repairlens
    user: repairlens
