name: Promote RepairLens to production

on:
  workflow_dispatch:

concurrency:
  group: repairlens-production-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  release-gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://repairlens-mvp.onrender.com
    timeout-minutes: 45
    steps:
      - name: Require all five successful push workflows for the current main commit
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const repo = context.repo;
            const required = [
              'RepairLens verification',
              'RepairLens container verification',
              'RepairLens Compose integration',
              'RepairLens PostgreSQL verification',
              'RepairLens Playwright E2E',
            ];
            const deadline = Date.now() + 20 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data: main } = await github.rest.repos.getBranch({ ...repo, branch: 'main' });
              if (main.commit.sha !== sha) {
                core.setFailed(`${sha} is no longer main HEAD. Run promotion again from main.`);
                return;
              }

              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                ...repo, branch: 'main', event: 'push', head_sha: sha, per_page: 100,
              });
              const latest = required.map(name => runs
                .filter(run => run.name === name && run.head_sha === sha)
                .sort((a, b) => b.id - a.id)[0]);
              const failed = latest.find(run => run?.status === 'completed' && run.conclusion !== 'success');
              if (failed) {
                core.setFailed(`${failed.name}: ${failed.conclusion} for ${sha}`);
                return;
              }
              if (latest.every(run => run?.conclusion === 'success')) {
                core.setOutput('sha', sha);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            core.setFailed(`Timed out waiting for all five workflows for ${sha}`);

      - name: Verify development and promote the same commit
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          VERIFIED_SHA: ${{ steps.gate.outputs.sha }}
          DEV_URL: ${{ vars.REPAIRLENS_DEV_URL || 'https://repairlens-dev.onrender.com' }}
          PROD_URL: ${{ vars.REPAIRLENS_PROD_URL || 'https://repairlens-mvp.onrender.com' }}
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_DEPLOY_HOOK" ]]; then
            echo "::error::Configure the production RENDER_DEPLOY_HOOK secret."
            exit 1
          fi

          wait_for_commit() {
            local base_url="$1" expected_storage="$2" deadline=$((SECONDS + $3))
            local headers="$RUNNER_TEMP/repairlens-headers" body="$RUNNER_TEMP/repairlens-health"
            while (( SECONDS < deadline )); do
              if curl --silent --fail --max-time 60 --dump-header "$headers" \
                --output "$body" "${base_url%/}/api/health" &&
                tr -d '\r' < "$headers" | grep -iqx "x-repairlens-commit: ${VERIFIED_SHA}" &&
                jq -e --arg storage "$expected_storage" \
                  '.status == "ok" and .storage == $storage' "$body" >/dev/null; then
                return 0
              fi
              sleep 10
            done
            echo "::error::${base_url} did not serve ${VERIFIED_SHA} with healthy ${expected_storage} storage."
            return 1
          }

          wait_for_commit "$DEV_URL" sqlite 300
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" == "$VERIFIED_SHA" ]] ||
            { echo "::error::Main changed during verification. Run promotion again."; exit 1; }
          if [[ "$RENDER_DEPLOY_HOOK" == *\?* ]]; then
            separator='&'
          else
            separator='?'
          fi
          if ! curl --silent --fail --max-time 30 --request POST \
            --output /dev/null "${RENDER_DEPLOY_HOOK}${separator}ref=${VERIFIED_SHA}"; then
            echo "::error::Render did not accept the production deployment request."
            exit 1
          fi
          wait_for_commit "$PROD_URL" postgres 900
          echo "Production is healthy and serves verified commit ${VERIFIED_SHA}." >> "$GITHUB_STEP_SUMMARY"
