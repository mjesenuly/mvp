services:
  app:
    environment:
      DEPLOYMENT_ENVIRONMENT: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4318
      OTEL_EXPORTER_OTLP_TIMEOUT: "5000"
    depends_on:
      observability:
        condition: service_started
  observability:
    image: grafana/otel-lgtm:0.41.0
    environment:
      ENABLE_LOGS_GRAFANA: "true"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - observability-data:/data
      - ./infrastructure/observability/dashboards:/repairlens/dashboards:ro
      - ./infrastructure/observability/providers/repairlens.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/repairlens.yaml:ro
      - ./infrastructure/observability/alerting/repairlens.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/repairlens.yaml:ro
  oncall:
    image: python:3.13-alpine
    command: ["python", "-u", "/agent/oncall.py"]
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:0.5b
    volumes:
      - ./infrastructure/observability/oncall.py:/agent/oncall.py:ro
    depends_on:
      model-pull:
        condition: service_completed_successfully
  ollama:
    image: ollama/ollama:0.11.11
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 3s
      retries: 40
  model-pull:
    image: ollama/ollama:0.11.11
    entrypoint: ["ollama", "pull", "qwen2.5:0.5b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
volumes:
  observability-data:
  ollama-data:
